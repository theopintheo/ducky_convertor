<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo's Ducky Converter</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0f1a 0%, #050508 100%);
            --panel-bg: rgba(30, 30, 46, 0.45);
            --border-color: rgba(255, 179, 0, 0.15);
            --accent-glow: #ffb300;
            --accent-cyan: #00f2fe;
            --text-main: #f1f1f7;
            --text-muted: #9499b3;
            --code-color: #38ef7d;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        0 0 40px rgba(255, 179, 0, 0.03);
        }

        header {
            text-align: center;
            margin-bottom: 35px;
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin: 0 0 8px 0;
            background: linear-gradient(90deg, #ffb300, #ffea00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 179, 0, 0.2);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .config-panel {
            background: rgba(15, 15, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            align-items: center;
            margin-bottom: 30px;
        }

        .config-item {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .config-item label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        input[type="number"] {
            width: 80px;
            padding: 8px 12px;
            background: #0b0b11;
            color: var(--accent-cyan);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-family: monospace;
            font-size: 1rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        input[type="checkbox"] {
            accent-color: var(--accent-glow);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        @media (max-width: 850px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .editor-box {
            display: flex;
            flex-direction: column;
        }

        .editor-box label {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        textarea {
            width: 100%;
            height: 420px;
            background: #0a0a0f;
            color: var(--code-color);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre;
            overflow-x: auto;
            resize: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(255, 179, 0, 0.15);
        }

        #duckyOutput {
            color: #89b4fa;
            background: #07070a;
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        button {
            padding: 14px 32px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 10px;
            cursor: pointer;
            border: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary {
            background: linear-gradient(90deg, #ffb300, #ffa000);
            color: #050508;
            box-shadow: 0 4px 20px rgba(255, 179, 0, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 179, 0, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>THEO'S DUCKY CONVERTER</h1>
        <div class="subtitle">Layout Engine & Injection Profiler</div>
    </header>
    
    <div class="config-panel">
        <div class="config-item">
            <label for="delayInput">Line Delay (ms)</label>
            <input type="number" id="delayInput" value="100" min="0">
        </div>
        <div class="config-item">
            <input type="checkbox" id="enterCheckbox" checked>
            <label for="enterCheckbox">Auto-Execution (Append ENTER)</label>
        </div>
        <div class="config-item">
            <input type="checkbox" id="indentFix" checked>
            <label for="indentFix">Lock Structural Indentation</label>
        </div>
    </div>

    <div class="grid">
        <div class="editor-box">
            <label for="sourceCode">⚡ Source Compiler Layout</label>
            <textarea id="sourceCode" placeholder="for i in range(5):&#10;    print(&quot;System Override Complete&quot;)&#10;    if i == 2:&#10;        break"></textarea>
        </div>
        <div class="editor-box">
            <label for="duckyOutput">💾 Generated Duckyscript Stream</label>
            <textarea id="duckyOutput" readonly placeholder="Waiting for structural data stream array conversion..."></textarea>
        </div>
    </div>

    <div class="controls">
        <button class="btn-primary" onclick="convertText()">Convert Layout</button>
        <button class="btn-secondary" onclick="copyToClipboard()">Copy Payload</button>
    </div>
</div>

<script>
    function convertText() {
        const input = document.getElementById('sourceCode').value;
        const delay = document.getElementById('delayInput').value;
        const addEnter = document.getElementById('enterCheckbox').checked;
        const strictIndent = document.getElementById('indentFix').checked;
        
        if (!input) {
            document.getElementById('duckyOutput').value = "System Error: Input string matrix cannot be left empty.";
            return;
        }

        const lines = input.split('\n');
        let duckyScript = `REM Compiled via Theo's Ducky Layout Engine\nDELAY 500\n\n`;

        lines.forEach((line) => {
            if (line.replace(/\s/g, '').length === 0) {
                if (addEnter) duckyScript += `ENTER\n`;
                if (delay > 0) duckyScript += `DELAY ${delay}\n`;
                return;
            }

            if (strictIndent) {
                const match = line.match(/^(\s+)/);
                if (match) {
                    const whitespace = match[1];
                    const content = line.substring(whitespace.length);

                    duckyScript += `STRING ${whitespace}\n`;
                    if (content.length > 0) {
                        duckyScript += `STRING ${content}\n`;
                    }
                } else {
                    duckyScript += `STRING ${line}\n`;
                }
            } else {
                duckyScript += `STRING ${line}\n`;
            }
            
            if (addEnter) {
                duckyScript += `ENTER\n`;
            }

            if (delay > 0) {
                duckyScript += `DELAY ${delay}\n`;
            }
        });

        document.getElementById('duckyOutput').value = duckyScript.trim();
    }

    function copyToClipboard() {
        const outputText = document.getElementById('duckyOutput');
        if (!outputText.value || outputText.value.startsWith("System Error")) return;
        
        outputText.select();
        navigator.clipboard.writeText(outputText.value);
        alert("Payload structure successfully saved to clipboard clipboard memory storage module.");
    }
</script>

</body>
</html>
